name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  evidence-matrix:
    # Fail-closed claim gate: runs BEFORE any install step, on the bare runner
    # python — no pip, no network, no secrets. While any row in
    # evidence/matrix.yaml is unverifiable, this job refuses the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify evidence matrix (pre-install, fail-closed)
        run: python3 tools/verify_evidence_matrix.py

  tests:
    # Executes the `test` evidence rows; the verifier checks their static
    # existence and this job runs them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run test suite
        run: pytest -q tests/
