# Evidence matrix — stackoverflow-community-radar (schema v1)
#
# Every capability claim stated in README.md (and the committed docs it points
# at) is bound here to deterministic evidence that CI executes on every pull
# request. Exactly four evidence types: test / script / manifest_field /
# artifact_hash. Fail-closed: while any row is unverifiable, the
# evidence-matrix CI job refuses the build — there is no skip flag.

schema_version: 1
repo: stackoverflow-community-radar

claims:
  - id: C001
    claim: "Rank unanswered questions by a deterministic urgency score."
    source: "README.md#what-it-does"
    evidence:
      - type: test
        ref: "tests/test_stackoverflow_radar.py::test_rank_questions_prioritizes_unanswered_threads"
      - type: script
        ref: "scripts/verify_offline_sample_mode.py"
        timeout_seconds: 120

  - id: C002
    claim: "Ingest Stack Overflow questions from the Stack Exchange API or bundled sample data."
    source: "README.md#what-it-does"
    evidence:
      - type: test
        ref: "tests/test_client_offline.py::test_force_sample_returns_bundled_questions"
      - type: test
        ref: "tests/test_client_offline.py::test_api_failure_falls_back_to_sample"

  - id: C003
    claim: "Cluster questions by tag overlap and topic proximity."
    source: "README.md#what-it-does"
    evidence:
      - type: test
        ref: "tests/test_stackoverflow_radar.py::test_topic_graph_builds_tag_network"
      - type: test
        ref: "tests/test_stackoverflow_radar.py::test_cluster_and_brief_shapes"

  - id: C004
    claim: "Generate answer briefs for community contributions."
    source: "README.md#what-it-does"
    evidence:
      - type: test
        ref: "tests/test_stackoverflow_radar.py::test_cluster_and_brief_shapes"

  - id: C005
    claim: "Render the result in a Streamlit dashboard: priority queue, graph summary, topic clusters, and answer brief."
    source: "README.md#dashboard"
    evidence:
      - type: script
        ref: "scripts/check_streamlit_entrypoint_RENAMED.py"
        timeout_seconds: 120

  - id: C006
    claim: "The app falls back to bundled sample questions if the API is unavailable."
    source: "README.md#notes"
    evidence:
      - type: test
        ref: "tests/test_client_offline.py::test_api_failure_falls_back_to_sample"
      - type: script
        ref: "scripts/verify_offline_sample_mode.py"
        timeout_seconds: 120

  - id: C007
    claim: "The core logic is deterministic so the sample mode can be tested without network access."
    source: "README.md#notes"
    evidence:
      - type: script
        ref: "scripts/verify_offline_sample_mode.py"
        timeout_seconds: 120

  - id: C008
    claim: "The derivation of (1.3) from (1.1) (Part II, p. 255) is verified numerically; two analytic steps still need rigorous justification, so it is not yet a proof."
    source: "data/kg/proof_sketches/part2_p255_corollary_from_entry1.md"
    evidence:
      - type: script
        ref: "scripts/check_p255_numeric.py"
        timeout_seconds: 120
